[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentminer"
version = "0.1.0"
description = "Hugging Face Parquet pipeline for mining and ScanCode-scoring opening comments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "huggingface-hub>=1,<2",
    "httpx>=0.28,<1",
    "ml4setk",
    "pygments>=2.18,<3",
    "pyarrow>=18,<20",
    "smart-open[s3]>=7,<8",
    "tqdm>=4.66,<5",
    "zstandard>=0.23,<1",
    "scancode-toolkit>=32.5.0",
    "numpy>=2,<3",
    "bertopic>=0.17.4",
    "sentence-transformers>=5,<6",
]

[dependency-groups]
dev = []

[project.scripts]
commentminer = "commentminer.cli:main"
commentminer-dashboard = "commentminer.stackv3_dashboard:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commentminer = ["data/*.json"]

[tool.uv.sources]
ml4setk = { url = "https://github.com/jkatzy/ML4SE-toolkit/archive/d3e1183716188b1a9b336d34bc579f58b69f1bc5.tar.gz" }
