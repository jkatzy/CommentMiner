[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commentminer"
version = "0.1.0"
description = "Storage-aware pipeline scaffolding for mining opening comments from large code datasets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "huggingface-hub>=1,<2",
    "httpx>=0.28,<1",
    "ml4setk",
    "pyarrow>=18,<20",
    "smart-open[s3]>=7,<8",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = []

[project.scripts]
commentminer = "commentminer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ml4setk = { url = "https://github.com/jkatzy/ML4SE-toolkit/archive/7a2adcb665db5a6051fa7d758754f68540609135.tar.gz" }
